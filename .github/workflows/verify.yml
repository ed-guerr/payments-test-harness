# CI for the whole stack — three jobs:
#
#   verify  the exact one-command check developers run locally
#           (harness: `npm run verify`): C build with -Werror, ASan+UBSan
#           smoke test (28 checks), clang-format, typecheck, live suite run,
#           MCP author A/B (KB vs no-KB), KB staleness.
#
#   e2e     drives the real Electron window through the actual preload
#           bridge (HARNESS_SELF_TEST=1: listSuites + runSuite over IPC).
#
#   docker  builds the headless image (multi-stage: gcc C build, npm ci,
#           registry-staleness diff) and proves it runs: one suite green +
#           the recorded-trace replay gate. Also the "C builds with gcc" job.
#
# All jobs must be green for a push/PR to main.
name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # fmt-check is version-sensitive: pin the exact clang-format that
      # formatted the code (PyPI ships the official prebuilt binary).
      CLANG_FORMAT: ${{ github.workspace }}/.tools/cf/clang_format/data/bin/clang-format
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install pinned clang-format 23.1.3
        run: python3 -m pip install --quiet --target .tools/cf clang-format==23.1.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install harness deps
        working-directory: harness
        run: npm ci

      # One command, identical to local dev: C build (-Werror) ->
      # ASan/UBSan build + 28-check smoke -> fmt-check -> typecheck ->
      # payment-happy-path suite (fresh cluster) -> MCP author A/B -> KB.
      - name: npm run verify
        working-directory: harness
        run: npm run verify

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: run-reports
          path: |
            artifacts/suite-runs/*.json
            artifacts/test-reports/*.html
          if-no-files-found: ignore

  e2e:
    name: electron self-test (real window + preload bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System deps (sqlite + electron/Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev xvfb xauth \
            libgtk-3-0t64 libnotify4 libnss3 libxss1 libasound2t64 libxtst6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install harness deps
        working-directory: harness
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: make

      # Builds the app, loads the real window, then drives the renderer
      # through the actual preload bridge: listSuites +
      # runSuite('payment-happy-path'). Exits non-zero on any failure.
      #
      # --no-sandbox: the standard Electron-in-CI flag. The electron zip
      # ships chrome-sandbox at mode 0755 and runners are non-root, so
      # Chromium aborts on the "found but not root:4755" helper. The
      # self-test verifies the preload bridge, not the Chromium sandbox.
      - name: xvfb-run npm run test:e2e
        working-directory: harness
        run: xvfb-run -a npm run test:e2e -- --no-sandbox

  docker:
    name: docker image (build + headless run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Multi-stage: gcc -Werror C build, npm ci (electron binary skipped),
      # registry.json staleness diff, slim runtime stage.
      - name: Build image
        run: docker build -t payments-harness:ci .

      # The image's default command: one suite green on a fresh cluster.
      - name: One suite green in the image
        run: docker run --rm payments-harness:ci

      # The deterministic agent-surface gate, fully offline.
      - name: Recorded-trace replay in the image
        run: docker run --rm payments-harness:ci eval:replay
